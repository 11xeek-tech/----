<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radial Menu</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#eef1fa; --bg2:#d9def0; --ink:#1e2433; --tile:#f2f4fa;
  --ring:rgba(79,70,229,.22); --tipbg:rgba(255,255,255,.95); --tipink:#1e2433;
  --shadow:0 8px 20px rgba(30,36,51,.15);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#141a2e; --bg2:#070a12; --ink:#e8ecf8; --tile:#e4e8f2;
    --ring:rgba(147,130,255,.28); --tipbg:rgba(15,23,42,.92); --tipink:#f1f5f9;
    --shadow:0 10px 26px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg1:#141a2e; --bg2:#070a12; --ink:#e8ecf8; --tile:#e4e8f2;
  --ring:rgba(147,130,255,.28); --tipbg:rgba(15,23,42,.92); --tipink:#f1f5f9;
  --shadow:0 10px 26px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{
  display:flex;justify-content:center;align-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,var(--bg1),var(--bg2));
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
}
.menu{position:relative;width:84px;height:84px;display:flex;justify-content:center;align-items:center;
  padding:200px;margin:-200px}
/* guide ring */
.ring{position:absolute;left:50%;top:50%;width:calc(var(--r)*2);height:calc(var(--r)*2);
  border-radius:50%;border:1.5px dashed var(--ring);transform:translate(-50%,-50%) scale(.6);
  opacity:0;transition:opacity .8s ease,transform 1.1s cubic-bezier(.16,1,.3,1);pointer-events:none}
.menu.open .ring{opacity:1;transform:translate(-50%,-50%) scale(1)}

.main{
  position:relative;z-index:50;width:72px;height:72px;min-width:72px;border-radius:50%;
  display:flex;justify-content:center;align-items:center;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#4f46e5,#9333ea 60%,#db2777);
  box-shadow:0 0 28px rgba(147,51,234,.5),inset 0 1px 1px rgba(255,255,255,.35);
  transition:transform .6s cubic-bezier(.16,1,.3,1),box-shadow .5s ease;
}
.main::before{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:2px solid rgba(147,51,234,.35);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.menu.open .main::before{animation:none;opacity:0}
.main svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.menu.open .main{transform:scale(1.08);box-shadow:0 0 40px rgba(147,51,234,.75),inset 0 1px 2px rgba(255,255,255,.5)}
.menu.open .main svg{transform:rotate(135deg)}

.item{
  position:absolute;width:58px;height:58px;min-width:58px;border-radius:50%;
  display:flex;justify-content:center;align-items:center;text-decoration:none;
  background:var(--bg,color-mix(in srgb,var(--glow,#888) 13%,var(--tile)));box-shadow:var(--shadow);
  border:1.5px solid color-mix(in srgb,var(--glow,#888) 32%,transparent);
  opacity:0;visibility:hidden;transform:translate(0,0) scale(.2);z-index:20;will-change:transform,opacity;
  transition:transform .7s cubic-bezier(.4,0,.2,1) var(--cd,0ms),opacity .45s ease var(--cd,0ms),visibility 0s linear 1.2s,box-shadow .3s ease;
}
.item svg{width:30px;height:30px;display:block}
.menu.open .item{
  opacity:1;visibility:visible;transform:translate(var(--tx),var(--ty)) scale(1);
  transition:transform 1s cubic-bezier(.16,1,.3,1) var(--od,0ms),opacity .5s ease var(--od,0ms),visibility 0s,box-shadow .3s ease;
}
.menu.settled .item{transition-delay:0s!important}
.menu .item:hover,.menu .item:focus-visible{
  transform:translate(var(--tx),var(--ty)) scale(1.18)!important;z-index:40;outline:none;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease,opacity .2s;transition-delay:0s;
  box-shadow:0 0 0 3px var(--glow,#fff),0 0 24px var(--glow,#fff),var(--shadow);
}
.tip{
  position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(-4px) scale(.9);
  background:var(--tipbg);color:var(--tipink);padding:5px 12px;border-radius:20px;
  font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;visibility:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.3);transition:opacity .18s,transform .18s,visibility .18s;
}
.item:hover .tip,.item:focus-visible .tip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0) scale(1)}
@media (prefers-reduced-motion:reduce){
  .main::before{animation:none}
}
</style>
</head>

<script>
(function(){
  var menu=document.getElementById('menu'), main=document.getElementById('main');
  var items=[].slice.call(document.querySelectorAll('.item'));
  function layout(){
    var vmin=Math.min(window.innerWidth,window.innerHeight);
    var r=Math.max(105,Math.min(175,vmin/2-50));
    menu.style.setProperty('--r',r+'px');
    items.forEach(function(el,i){
      var a=(i/items.length)*2*Math.PI-Math.PI/2;
      el.style.setProperty('--tx',Math.round(r*Math.cos(a))+'px');
      el.style.setProperty('--ty',Math.round(r*Math.sin(a))+'px');
      el.style.setProperty('--od',(i*45)+'ms');el.style.setProperty('--cd',((items.length-1-i)*28)+'ms');
    });
  }
  layout();
  window.addEventListener('resize',layout);
  /* touch / keyboard: tap the centre button to toggle */
  var t,s,canHover=window.matchMedia('(hover:hover)').matches;
  function open(){clearTimeout(t);clearTimeout(s);menu.classList.add('open');s=setTimeout(function(){menu.classList.add('settled')},1600)}
  function shut(){clearTimeout(s);menu.classList.remove('settled');menu.classList.remove('open')}
  function toggle(){menu.classList.contains('open')?shut():open()}
  if(canHover){
    menu.addEventListener('mouseenter',open);
    menu.addEventListener('mouseleave',function(){t=setTimeout(shut,300)});
  }
  main.addEventListener('click',function(){if(!canHover)toggle()});
  main.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
})();
</script>
