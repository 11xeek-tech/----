<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radial Menu</title>
  
  <style>
    /* Reset & Base Settings */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090d16; /* Dark comfortable background */
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Radial Menu Container */
    .menu-container {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Hit area buffer to avoid accidental closing while hovering towards sub-buttons */
      padding: 170px;
      margin: -170px;
    }

    /* Central Main Button - Guaranteed Perfectly Circular */
    .main-btn {
      position: relative;
      width: 72px;
      height: 72px;
      min-width: 72px;
      min-height: 72px;
      max-width: 72px;
      max-height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      box-shadow: 0 0 25px rgba(147, 51, 234, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      cursor: pointer;
      z-index: 50;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
      aspect-ratio: 1 / 1;
    }

    .main-btn svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.4s ease;
    }

    /* Hover effect on Central Button */
    .menu-container:hover .main-btn {
      transform: scale(1.1);
      box-shadow: 0 0 35px rgba(147, 51, 234, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.5);
    }
    
    .menu-container:hover .main-btn svg {
      transform: rotate(135deg);
    }

    /* Sub-buttons (Icons) */
    .sub-btn {
      position: absolute;
      width: 54px;
      height: 54px;
      min-width: 54px;
      min-height: 54px;
      border-radius: 50%;
      background: rgba(22, 30, 46, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      z-index: 20;
      aspect-ratio: 1 / 1;
      
      /* Hidden state by default */
      opacity: 0;
      visibility: hidden;
      transform: translate(0, 0) scale(0.2);
      
      /* Smooth return / closing animation */
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.45s ease,
                  visibility 0.45s,
                  background-color 0.25s ease,
                  border-color 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .sub-btn svg {
      width: 26px;
      height: 26px;
      transition: transform 0.25s ease;
    }

    /* Individual Brand Glow and Hover Styling */
    .sub-btn:hover {
      transform: translate(var(--tx), var(--ty)) scale(1.2) !important;
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(255, 255, 255, 0.3);
      z-index: 40;
    }

    .sub-btn:hover svg {
      transform: scale(1.08);
    }

    /* Custom Tooltip Styling (Glassmorphism Pill) */
    .sub-btn .tooltip {
      position: absolute;
      bottom: -38px;
      left: 50%;
      transform: translateX(-50%) translateY(-6px) scale(0.85);
      background: rgba(15, 23, 42, 0.9);
      color: #f1f5f9;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }

    /* Show Tooltip when hovering a sub-button */
    .sub-btn:hover .tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* Specific Glow Effects on Hover */
    .sub-btn[data-brand="chatgpt"]:hover { box-shadow: 0 0 20px rgba(16, 163, 127, 0.5); }
    .sub-btn[data-brand="gemini"]:hover { box-shadow: 0 0 20px rgba(155, 114, 203, 0.5); }
    .sub-btn[data-brand="claude"]:hover { box-shadow: 0 0 20px rgba(217, 119, 6, 0.5); }
    .sub-btn[data-brand="perplexity"]:hover { box-shadow: 0 0 20px rgba(34, 211, 238, 0.5); }
    .sub-btn[data-brand="facebook"]:hover { box-shadow: 0 0 20px rgba(24, 119, 242, 0.5); }
    .sub-btn[data-brand="youtube"]:hover { box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
    .sub-btn[data-brand="github"]:hover { box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
    .sub-btn[data-brand="classroom"]:hover { box-shadow: 0 0 20px rgba(15, 157, 88, 0.5); }
    .sub-btn[data-brand="moodle"]:hover { box-shadow: 0 0 20px rgba(249, 115, 22, 0.5); }

    /* Expand Menu when Hovering Container */
    .menu-container:hover .sub-btn {
      opacity: 1;
      visibility: visible;
      transform: translate(var(--tx), var(--ty)) scale(1);
    }
  </style>
</head>
<body>

  <script>
    const subBtns = document.querySelectorAll('.sub-btn');
    const total = subBtns.length;
    const radius = 155; // Radius distance from the center button
    const delayStep = 0.045; // Stagger animation timing in seconds

    subBtns.forEach((btn, index) => {
      // Calculate radial position in radians (evenly spaced 360 degrees)
      const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
      
      const x = Math.round(radius * Math.cos(angle));
      const y = Math.round(radius * Math.sin(angle));

      btn.style.setProperty('--tx', `${x}px`);
      btn.style.setProperty('--ty', `${y}px`);

      // Sequential stagger animation on hover expand
      btn.style.transitionDelay = `${index * delayStep}s`;
    });
  </script>

</body>
</html>
